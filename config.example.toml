[carousel]
prefix = "C-g"
idle_timeout = 30      # seconds without input before switching to the next machine
interval = 20          # seconds per machine while rotating
auto_rotate = true     # false starts paused until prefix + Space
status_bar = true      # false gives the application every terminal row

restart_on_exit = false # Automatically restart exited commands and SSH sessions.
restart_limit = 3       # Fail on the third attempt within the rolling window.
restart_window = 60     # Seconds in the rolling restart window.
restart_delay = 1       # Seconds to wait before an automatic restart.

[bindings]             # All bindings require the prefix first.
previous = "Left"
next = "Right"
toggle_rotation = "Space"
reconnect = "r"        # Restart the active command / SSH connection.
quit = "q"             # Close tcar and all its sessions.

[defaults]
command = "btop"
ssh_args = ["-o", "ServerAliveInterval=15", "-o", "ServerAliveCountMax=3"]

[[machines]]
name = "local"
local_command = ["btop"]

[[machines]]
name = "server-one"
host = "server-one"    # An alias from ~/.ssh/config, or user@hostname.

[[machines]]
name = "server-two"
host = "server-two"
